<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agente de Órdenes de Compra — SAP</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--borde:#30363d;--texto:#e6edf3;--suave:#8b949e;
        --acento:#2ec4b6;--alerta:#f0a202;--error:#f85149;--ok:#3fb950;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);
       color:var(--texto);height:100vh;display:flex;flex-direction:column}
  header{padding:12px 20px;border-bottom:1px solid var(--borde);display:flex;align-items:center;
         gap:12px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600}
  .estado{font-size:12px;color:var(--suave)}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--acento);display:inline-block}
  main{flex:1;overflow-y:auto;padding:20px;max-width:960px;width:100%;margin:0 auto}
  .msg{margin-bottom:12px;padding:12px 14px;border-radius:10px;line-height:1.55;font-size:14px}
  .usuario{background:#1f2937;border:1px solid var(--borde)}
  .agente{background:var(--panel);border:1px solid var(--borde);white-space:pre-wrap}
  .tool{background:rgba(46,196,182,.07);border:1px solid rgba(46,196,182,.3);
        font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .tool .n{color:var(--acento);font-weight:600}
  .tool.err{background:rgba(248,81,73,.08);border-color:rgba(248,81,73,.35)}
  .tool.err .n{color:var(--error)}
  .confirmar{background:rgba(240,162,2,.12);border:1px solid rgba(240,162,2,.5)}
  .confirmar .n{color:var(--alerta);font-weight:600}
  .error{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.4);color:#ffb4ae}
  .et{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);margin-bottom:6px}
  pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--suave);font-size:11.5px;
      max-height:340px;overflow:auto}
  details summary{cursor:pointer;color:var(--suave);font-size:11.5px;margin-top:6px}
  footer{border-top:1px solid var(--borde);padding:12px 20px}
  .barra{display:flex;gap:10px;max-width:960px;margin:0 auto}
  input{flex:1;background:var(--panel);border:1px solid var(--borde);color:var(--texto);
        padding:11px 14px;border-radius:8px;font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--acento)}
  button{background:var(--acento);color:#06261f;border:0;padding:11px 18px;border-radius:8px;
         font-weight:600;cursor:pointer;font-size:14px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .sec{background:transparent;color:var(--suave);border:1px solid var(--borde)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;max-width:960px;margin-inline:auto}
  .chip{font-size:11.5px;padding:5px 10px;border:1px solid var(--borde);border-radius:999px;
        color:var(--suave);cursor:pointer;background:transparent}
  .chip:hover{border-color:var(--acento);color:var(--acento)}
  .pensando{display:inline-flex;gap:4px;align-items:center;color:var(--suave);font-size:13px}
  .pensando i{width:6px;height:6px;border-radius:50%;background:var(--acento);
              animation:p 1.2s infinite ease-in-out}
  .pensando i:nth-child(2){animation-delay:.2s}
  .pensando i:nth-child(3){animation-delay:.4s}
  @keyframes p{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .aviso{background:rgba(240,162,2,.12);border:1px solid rgba(240,162,2,.5);border-radius:8px;
         padding:9px 12px;font-size:13px;margin-bottom:10px;max-width:960px;margin-inline:auto;
         color:#ffd98a}
</style>
</head>
<body>
  <header>
    <span class="punto"></span>
    <h1>Agente de Órdenes de Compra · SAP</h1>
    <span class="estado" id="estado">conectando…</span>
    <button class="sec" style="margin-left:auto" onclick="reiniciar()">Nueva sesión</button>
  </header>

  <main id="chat">
    <div class="msg agente"><div class="et">Agente</div>Hola. Puedo procesar una solicitud de compra: leo el paquete, valido los controles contra los maestros y creo la orden en SAP cuando corresponde. Dime qué caso quieres procesar.</div>
  </main>

  <footer>
    <div id="aviso"></div>
    <div class="chips" id="chips"></div>
    <div class="barra">
      <input id="entrada" placeholder='Procesa la solicitud "sol-004"' onkeydown="if(event.key==='Enter')enviar()" />
      <button id="btn" onclick="enviar()">Enviar</button>
    </div>
  </footer>

<script>
const chat=document.getElementById("chat"), entrada=document.getElementById("entrada"),
      btn=document.getElementById("btn"), avisoBox=document.getElementById("aviso");
const sessionId = "s-" + Math.random().toString(36).slice(2,9);
let pensandoEl=null;

const esc = t => String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function burbuja(clase,etiqueta,html){
  const d=document.createElement("div");
  d.className="msg "+clase;
  d.innerHTML=`<div class="et">${etiqueta}</div>`+html;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
}

function pintarTool(ev){
  const err = ev.resultado && ev.resultado.ok===false;
  const bloqueos = ev.resultado?.bloqueos?.length ?? 0;
  const confirmaciones = ev.resultado?.confirmaciones?.length ?? 0;
  let insignia = "";
  if (bloqueos) insignia += ` <span style="color:#f85149">· ${bloqueos} bloqueo(s)</span>`;
  if (confirmaciones) insignia += ` <span style="color:#f0a202">· ${confirmaciones} confirmación(es)</span>`;
  if (ev.resultado?.numero_oc) insignia += ` <span style="color:#3fb950">· OC ${ev.resultado.numero_oc}</span>`;

  burbuja("tool"+(err?" err":""),"Herramienta ejecutada",
    `<span class="n">${esc(ev.nombre)}</span>${insignia}
     <details><summary>argumentos y resultado</summary>
     <pre>${esc(JSON.stringify({argumentos:ev.argumentos,resultado:ev.resultado},null,2))}</pre></details>`);
}

function mostrarPensando(){
  pensandoEl=burbuja("agente","Agente",
    `<span class="pensando"><i></i><i></i><i></i> pensando…</span>`);
}
function quitarPensando(){ if(pensandoEl){pensandoEl.remove();pensandoEl=null;} }

async function enviar(){
  const texto=entrada.value.trim(); if(!texto) return;
  entrada.value=""; avisoBox.innerHTML="";
  burbuja("usuario","Analista",esc(texto));
  btn.disabled=true; mostrarPensando();

  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({sessionId,message:texto})});
    const data=await r.json();
    quitarPensando();

    if(data.error){ burbuja("error","Error",esc(data.error)); return; }

    for(const ev of data.eventos ?? []){
      if(ev.tipo==="texto") burbuja("agente","Agente",esc(ev.contenido));
      else if(ev.tipo==="herramienta") pintarTool(ev);
      else if(ev.tipo==="error") burbuja("error","Error",esc(ev.contenido));
    }

    if(data.needsConfirmation){
      avisoBox.innerHTML=`<div class="aviso">⚠ El agente está esperando tu confirmación explícita. Responde <b>confirmo</b> para proceder, o indica qué ajustar.</div>`;
      burbuja("confirmar","Confirmación humana requerida",
        `<span class="n">El agente no creará la orden hasta que confirmes.</span>`);
    }
  }catch(e){
    quitarPensando(); burbuja("error","Error",esc(e.message));
  }finally{ btn.disabled=false; entrada.focus(); }
}

async function reiniciar(){
  await fetch(`/api/sessions/${sessionId}/reset`,{method:"POST"});
  chat.innerHTML=""; avisoBox.innerHTML="";
  burbuja("agente","Agente","Sesión reiniciada. ¿Qué solicitud quieres procesar?");
}

fetch("/api/health").then(r=>r.json()).then(s=>{
  document.getElementById("estado").textContent =
    `${s.herramientas.length} herramientas · ${s.casos.length} casos` +
    (s.model ? ` · ${s.provider}/${s.model}` : " · sin modelo configurado");
  const c=document.getElementById("chips");
  for(const caso of s.casos){
    const b=document.createElement("button");
    b.className="chip"; b.textContent=`Procesa ${caso}`;
    b.onclick=()=>{entrada.value=`Procesa la solicitud "${caso}". Muéstrame la OC como quedaría en SAP, qué validaciones pasó y cuáles no, y no la crees hasta que yo lo confirme.`;enviar();};
    c.appendChild(b);
  }
});
</script>
</body>
</html>
